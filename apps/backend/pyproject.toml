[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "google-adk>=1.20",
    "httpx>=0.28.1",
    "mcp>=1.0.0",
    "numpy>=1.26.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot[job-queue]>=22.8",
    "scikit-learn>=1.5.0",
    "sqlmodel>=0.0.42",
    "tzdata>=2026.4",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::DeprecationWarning",
]
